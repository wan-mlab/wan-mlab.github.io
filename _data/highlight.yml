- title: " RaMBat: Accurate identification of medulloblastoma subtypes from diverse data sources with severe batch effects"
  image: RAMBAT.jpg
  description: We propose a novel approach called RaMBat for accurate MB subtyping from diverse data sources with severe batch effects. RaMBat could efficiently deal with the batch effects and clearly separate subtypes of MB samples from diverse data sources. 
  authors: <u>M. Sun</u>, J. Wang and <b><u>S. Wan*</u></b>
