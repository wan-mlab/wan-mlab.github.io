- title: "Mapping Structural and Molecular Spatiotemporal Dynamics of Macaque Brain during Development and Aging"
  image: scrna.png
  description: We systematically characterized brain structural, cellular and molecular spatiotemporal dynamics from birth to 18 years of macaques integrating multimodal magnetic resonance imaging and single-cell transcriptomics. These findings establish a crucial multiscale framework for understanding primate brain development and aging and shed new light on the divergent evolution between macaques and humans. 
  authors: Y. Ma<sup>#</sup>, <u>X. Wu</u><sup>#</sup>, R. Zhu<sup>#</sup>, Q. Sun<sup>#</sup>, F. Yang<sup>#</sup>, Z. Wang<sup>#</sup>, S. Dai<sup>#</sup>, X. Qiu, X. Yu, W. Sun, K. Chen, H. Wang, L. Cheng, S. Xie, T. Xu, Y. Chen, W. Ji\*, <b><u>S. Wan*</u></b> and J. Wang\*
